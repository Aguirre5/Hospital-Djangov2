{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar médico</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'app_hospital/styles.css' %}"
    >
</head>

<body>

    <nav class="navbar navbar-dark hospital-navbar">
        <div class="container">

            <a
                class="navbar-brand"
                href="{% url 'index' %}"
            >
                Sistema Hospitalario
            </a>

        </div>
    </nav>


    <main class="container py-5">

        <div class="mb-4 text-center">
            <h2 class="fw-bold">
                Registrar médico
            </h2>

            <p class="text-secondary">
                Complete la información del profesional.
            </p>
        </div>


        {% if messages %}

            <div class="messages-container">

                {% for message in messages %}

                    <div
                        class="
                            alert
                            {% if message.tags == 'error' %}
                                alert-danger
                            {% else %}
                                alert-{{ message.tags }}
                            {% endif %}
                        "
                    >
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <form
            method="POST"
            class="hospital-form"
        >

            {% csrf_token %}


            <div class="form-section">

                <h3 class="form-section-title">
                    Datos profesionales
                </h3>


                <div class="row g-3">

                    <div class="col-md-6">

                        <label
                            for="nombre"
                            class="form-label"
                        >
                            Nombre
                        </label>

                        <input
                            type="text"
                            name="nombre"
                            id="nombre"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label
                            for="apellido"
                            class="form-label"
                        >
                            Apellido
                        </label>

                        <input
                            type="text"
                            name="apellido"
                            id="apellido"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label
                            for="matricula"
                            class="form-label"
                        >
                            Matrícula
                        </label>

                        <input
                            type="text"
                            name="matricula"
                            id="matricula"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label
                            for="id_especialidad"
                            class="form-label"
                        >
                            Especialidad
                        </label>

                        <select
                            name="id_especialidad"
                            id="id_especialidad"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Seleccione una especialidad
                            </option>

                            {% for especialidad in especialidades %}

                                <option
                                    value="{{ especialidad.id_especialidad }}"
                                >
                                    {{ especialidad.nombre }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

            </div>


            <div class="form-section">

                <h3 class="form-section-title">
                    Contacto y atención
                </h3>


                <div class="row g-3">

                    <div class="col-md-6">

                        <label
                            for="telefono"
                            class="form-label"
                        >
                            Teléfono
                        </label>

                        <input
                            type="text"
                            name="telefono"
                            id="telefono"
                            class="form-control"
                        >

                    </div>


                    <div class="col-md-6">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            id="email"
                            class="form-control"
                        >

                    </div>


                    <div class="col-md-6">

                        <label
                            for="consultorio"
                            class="form-label"
                        >
                            Consultorio
                        </label>

                        <input
                            type="text"
                            name="consultorio"
                            id="consultorio"
                            class="form-control"
                        >

                    </div>


                    <div class="col-md-6">

                        <label
                            for="horario_atencion"
                            class="form-label"
                        >
                            Horario de atención
                        </label>

                        <input
                            type="text"
                            name="horario_atencion"
                            id="horario_atencion"
                            class="form-control"
                            placeholder="Ej: 08:00-12:00"
                        >

                    </div>

                </div>

            </div>


            <div class="d-flex gap-2 justify-content-end">

                <a
                    href="{% url 'medicos' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="btn btn-hospital"
                >
                    Guardar médico
                </button>

            </div>

        </form>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
