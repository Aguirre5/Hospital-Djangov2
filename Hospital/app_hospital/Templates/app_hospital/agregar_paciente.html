<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'app_hospital/styles.css' %}">
    <title>Editar Paciente</title>
</head>
<body>
    <h1>Editar Paciente</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Nombre:</label>
        <input type="text" name="nombre" value="{{ paciente.nombre }}"><br>

        <label>Apellido:</label>
        <input type="text" name="apellido" value="{{ paciente.apellido }}"><br>

        <label>DNI:</label>
        <input type="text" name="dni" value="{{ paciente.dni }}"><br>

        <label>Fecha de Nacimiento:</label>
        <input type="date" name="fecha_nacimiento" value="{{ paciente.fecha_nacimiento|date:'Y-m-d' }}"><br>

        <label for="sexo_asignado_al_nacer">Sexo asignado al nacer: </label>
        <select name="sexo_asignado_al_nacer" id="sexo_asignado_al_nacer" required>
            <option value="">Seleccione una opción:</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="I">Intersexual</option>
            <option value="N">No informado</option>
        </select>

        <label for="identidad_genero">Identidad de género: </label>
        <select name="identidad_genero" id="identidad_genero" required>
            <option value="">Seleccione una opción:</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="X">No binario</option>
            <option value="O">Otro</option>
            <option value="N">Prefiere no informar</option>
        </select>

        <div id="contenedor_identidad_otro" style="display: none;">
            <label for="identidad_genero_otro">
                Especificar identidad de género:
            </label>

            <input
                type="text"
                name="identidad_genero_otro"
                id="identidad_genero_otro"
                maxlength="100"
            >
        </div>

        <label>Direccion:</label>
        <input type="text" name="direccion" value="{{ paciente.direccion }}"><br>

        <label>Telefono:</label>
        <input type="text" name="telefono" value="{{ paciente.telefono }}"><br>

        <label>Email:</label>
        <input type="email" name="email" value="{{ paciente.email }}"><br>

        <label>Grupo Sanguineo:</label>
        <input type="text" name="grupo_sanguineo" value="{{ paciente.grupo_sanguineo }}"><br>

        <label>Contacto de Emergencia:</label>
        <input type="text" name="contacto_emergencia" value="{{ paciente.contacto_emergencia }}"><br>

        <label>Telefono de Emergencia:</label>
        <input type="text" name="telefono_emergencia" value="{{ paciente.telefono_emergencia }}"><br>

        <label>Obra Social:</label>
        <input type="text" name="obra_social" value="{{ paciente.obra_social }}"><br>

        <label>Numero de Afiliado:</label>
        <input type="text" name="numero_afiliado" value="{{ paciente.numero_afiliado }}"><br>
        <button type="submit">Guardar Cambios</button>
    </form>

    <a href="/pacientes/">Volver a Pacientes</a>

    <script>
        const identidadGenero = document.getElementById('identidad_genero');
        const contenedorOtro = document.getElementById('contenedor_identidad_otro');
        const identidadOtro = document.getElementById('identidad_genero_otro');

        identidadGenero.addEventListener('change', function() {
            if (this.value === 'O') {
                contenedorOtro.style.display = 'block';
                identidadOtro.required = true;
            } else {
                contenedorOtro.style.display = 'none';
                identidadOtro.required = false;
                identidadOtro.value = ''; // Limpia el campo.
            }
        });
    </script>



</body>
</html>
