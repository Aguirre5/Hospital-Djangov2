{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Modificar médico</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'app_hospital/styles.css' %}"
    >

</head>


<body>

    <nav class="navbar navbar-dark hospital-navbar">

        <div class="container">

            <a
                href="{% url 'index' %}"
                class="navbar-brand"
            >
                Sistema Hospitalario
            </a>

        </div>

    </nav>


    <main class="container py-5">

        <div class="text-center mb-4">

            <h2 class="fw-bold">
                Modificar médico
            </h2>

            <p class="text-secondary">
                Actualice los datos del profesional.
            </p>

        </div>


        <form
            method="POST"
            class="hospital-form"
        >

            {% csrf_token %}


            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ medico.nombre }}"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Apellido
                    </label>

                    <input
                        type="text"
                        name="apellido"
                        class="form-control"
                        value="{{ medico.apellido }}"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Matrícula
                    </label>

                    <input
                        type="text"
                        name="matricula"
                        class="form-control"
                        value="{{ medico.matricula }}"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Especialidad
                    </label>

                    <select
                        name="id_especialidad"
                        class="form-select"
                        required
                    >

                        {% for especialidad in especialidades %}

                            <option
                                value="{{ especialidad.id_especialidad }}"
                                {% if especialidad.id_especialidad == medico.id_especialidad %}
                                    selected
                                {% endif %}
                            >
                                {{ especialidad.nombre }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        name="telefono"
                        class="form-control"
                        value="{{ medico.telefono }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ medico.email }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Consultorio
                    </label>

                    <input
                        type="text"
                        name="consultorio"
                        class="form-control"
                        value="{{ medico.consultorio }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Horario de atención
                    </label>

                    <input
                        type="text"
                        name="horario_atencion"
                        class="form-control"
                        value="{{ medico.horario_atencion }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Estado
                    </label>

                    <select
                        name="estado"
                        class="form-select"
                    >

                        <option
                            value="Activo"
                            {% if medico.estado == "Activo" %}
                                selected
                            {% endif %}
                        >
                            Activo
                        </option>

                        <option
                            value="Inactivo"
                            {% if medico.estado == "Inactivo" %}
                                selected
                            {% endif %}
                        >
                            Inactivo
                        </option>

                    </select>

                </div>

            </div>


            <div class="d-flex justify-content-end gap-2 mt-4">

                <a
                    href="{% url 'medicos' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="btn btn-hospital"
                >
                    Guardar cambios
                </button>

            </div>

        </form>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
