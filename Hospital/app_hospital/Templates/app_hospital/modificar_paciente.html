{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Modificar paciente</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'app_hospital/styles.css' %}"
    >

</head>


<body>

    <nav class="navbar navbar-dark hospital-navbar">

        <div class="container">

            <a
                href="{% url 'index' %}"
                class="navbar-brand"
            >
                Sistema Hospitalario
            </a>

        </div>

    </nav>


    <main class="container py-5">

        <div class="text-center mb-4">

            <h2 class="fw-bold">
                Modificar paciente
            </h2>

            <p class="text-secondary">
                Actualice la información del paciente.
            </p>

        </div>


        <form
            method="POST"
            class="hospital-form"
        >

            {% csrf_token %}


            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ paciente.nombre }}"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Apellido
                    </label>

                    <input
                        type="text"
                        name="apellido"
                        class="form-control"
                        value="{{ paciente.apellido }}"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        DNI
                    </label>

                    <input
                        type="text"
                        name="dni"
                        class="form-control"
                        value="{{ paciente.dni }}"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Fecha de nacimiento
                    </label>

                    <input
                        type="date"
                        name="fecha_nacimiento"
                        class="form-control"
                        value="{{ paciente.fecha_nacimiento|date:'Y-m-d' }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Sexo asignado al nacer
                    </label>

                    <select
                        name="sexo_asignado_al_nacer"
                        class="form-select"
                    >

                        <option
                            value="M"
                            {% if paciente.sexo_asignado_al_nacer == "M" %}
                                selected
                            {% endif %}
                        >
                            Masculino
                        </option>

                        <option
                            value="F"
                            {% if paciente.sexo_asignado_al_nacer == "F" %}
                                selected
                            {% endif %}
                        >
                            Femenino
                        </option>

                        <option
                            value="I"
                            {% if paciente.sexo_asignado_al_nacer == "I" %}
                                selected
                            {% endif %}
                        >
                            Intersexual
                        </option>

                        <option
                            value="N"
                            {% if paciente.sexo_asignado_al_nacer == "N" %}
                                selected
                            {% endif %}
                        >
                            No informado
                        </option>

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Identidad de género
                    </label>

                    <select
                        name="identidad_genero"
                        class="form-select"
                    >

                        <option value="M">
                            Masculino
                        </option>

                        <option value="F">
                            Femenino
                        </option>

                        <option value="X">
                            No binario
                        </option>

                        <option value="O">
                            Otro
                        </option>

                        <option value="N">
                            Prefiere no informar
                        </option>

                    </select>

                </div>


                <div class="col-md-12">

                    <label class="form-label">
                        Dirección
                    </label>

                    <input
                        type="text"
                        name="direccion"
                        class="form-control"
                        value="{{ paciente.direccion }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        name="telefono"
                        class="form-control"
                        value="{{ paciente.telefono }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ paciente.email }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Grupo sanguíneo
                    </label>

                    <input
                        type="text"
                        name="grupo_sanguineo"
                        class="form-control"
                        value="{{ paciente.grupo_sanguineo }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Obra social
                    </label>

                    <input
                        type="text"
                        name="obra_social"
                        class="form-control"
                        value="{{ paciente.obra_social }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Número de afiliado
                    </label>

                    <input
                        type="text"
                        name="numero_afiliado"
                        class="form-control"
                        value="{{ paciente.numero_afiliado }}"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Estado
                    </label>

                    <select
                        name="estado"
                        class="form-select"
                    >

                        <option
                            value="Activo"
                            {% if paciente.estado == "Activo" %}
                                selected
                            {% endif %}
                        >
                            Activo
                        </option>

                        <option
                            value="Inactivo"
                            {% if paciente.estado == "Inactivo" %}
                                selected
                            {% endif %}
                        >
                            Inactivo
                        </option>

                    </select>

                </div>

            </div>


            <div class="d-flex justify-content-end gap-2 mt-4">

                <a
                    href="{% url 'pacientes' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="btn btn-hospital"
                >
                    Guardar cambios
                </button>

            </div>

        </form>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
