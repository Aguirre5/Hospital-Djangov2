{% load static %}
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingreso | Hospital</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{% static 'app_hospital/styles.css' %}" rel="stylesheet"></head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
<main class="container" style="max-width:480px"><div class="hospital-form">
<h1 class="h3 text-center mb-4">Sistema Hospitalario</h1>
<p class="text-center text-secondary">Acceso exclusivo para personal autorizado.</p>
{% for message in messages %}<div class="alert alert-danger" role="alert">{{ message }}</div>{% endfor %}
<form method="post" autocomplete="off">{% csrf_token %}
<div class="mb-3"><label class="form-label" for="username">Usuario</label><input id="username" name="username" type="text" maxlength="80" class="form-control" autocomplete="username" required autofocus></div>
<div class="mb-4"><label class="form-label" for="password">Contraseña</label><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div>
<button class="btn btn-hospital w-100" type="submit">Iniciar sesión</button>
</form></div></main></body></html>
